<title>Számhegy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: egy oszlopos, telefonra szabott képregény-játék — térkép (létra a hegyre) → pályaválasztó → rács a spirálfüzetben + számtálca */
:root{
  color-scheme:light;
  --ink:#1b1b2f;          /* képregény-kontúr */
  --sky1:#2f8cff; --sky2:#8fd8ff;
  --paper:#ffffff; --paper2:#eef0f6;
  --num:#2f9bff; --num-d:#1a6fd1;
  --plus:#ff9a1f; --plus-d:#d9700a;
  --minus:#a98bff; --minus-d:#7a5ce0;
  --eq:#ff5d8f; --eq-d:#d63a6c;
  --blank:#8e8f9b; --blank-d:#6b6c78;
  --yellow:#ffc82e; --yellow-d:#f08a00;
  --ok:#34c759; --ok-d:#1f9a40; --bad:#ff4d4d;
  --grass:#7ed957; --rock:#9aa0a8;
  --f-comic:"Bangers","Lilita One",Impact,"Arial Black",sans-serif;
  --f-tile:"Lilita One","Arial Rounded MT Bold","Arial Black",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:800 16px/1.35 var(--f-body);color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%,#c9f1ff 100%) fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden}
/* felhők */
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:160px;height:56px;background:#fff;border-radius:60px;opacity:.9;filter:drop-shadow(0 3px 0 rgba(27,27,47,.15))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:70px;height:70px;left:22px;top:-34px}
.cloud::after{width:52px;height:52px;left:80px;top:-22px}
.cloud.c1{top:9%;left:-20px;transform:scale(.9);animation:drift 60s linear infinite}
.cloud.c2{top:30%;right:-40px;transform:scale(.7);animation:drift 80s linear infinite reverse}
.cloud.c3{top:62%;left:10%;transform:scale(.55);animation:drift 90s linear infinite}
@keyframes drift{from{translate:-30px 0}to{translate:30px 0}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:grid;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}

/* képregény-gomb */
.cbtn{border:3px solid var(--ink);border-radius:14px;background:var(--yellow);box-shadow:0 5px 0 var(--ink);
  font:400 22px/1 var(--f-comic);letter-spacing:.06em;padding:12px 18px;transition:transform .08s,box-shadow .08s}
.cbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.cbtn.blue{background:var(--num);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.cbtn.pink{background:var(--eq);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.cbtn.small{font-size:17px;padding:8px 12px;border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.cbtn[disabled]{filter:grayscale(.8);opacity:.6}

/* fejléc-szalag */
.banner{justify-self:center;background:var(--yellow);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--yellow-d),0 7px 0 3px var(--ink);
  padding:8px 26px 4px;transform:rotate(-2deg)}
.banner h1{margin:0;font:400 clamp(44px,13vw,68px)/1 var(--f-comic);letter-spacing:.05em;color:#fff;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.tagline{text-align:center;color:#fff;font:900 15px var(--f-body);text-shadow:0 2px 0 rgba(27,27,47,.55)}

/* buborék + kabala */
.talk{display:flex;align-items:flex-end;gap:10px}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 14px;
  font:800 15.5px/1.3 var(--f-body);box-shadow:0 4px 0 rgba(27,27,47,.25)}
.bubble::before{content:"";position:absolute;left:-15px;bottom:14px;border:9px solid transparent;border-right:14px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:-9px;bottom:16px;border:7px solid transparent;border-right:11px solid #fff}
.bubble.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.mascot{flex:0 0 auto;width:68px;height:76px}
.mascot svg{width:100%;height:100%;overflow:visible}
.mascot .body{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px) scaleY(1.02)}}
.mascot .lid{transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.mascot.wow .body{animation:jump .5s}
.mascot.oops .body{animation:wobble .45s}
@keyframes jump{40%{transform:translateY(-14px)}}
@keyframes wobble{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* ===== térkép ===== */
.mapscreen{display:grid;gap:16px}
.tower{justify-self:center;width:150px;position:relative}
.tower svg{display:block;width:100%;height:auto}
.mountain{position:relative;display:grid;gap:14px;padding:6px 0 10px}
.mountain::before{content:"";position:absolute;left:50%;top:-6px;bottom:0;width:58px;transform:translateX(-50%);
  background:
   repeating-linear-gradient(180deg,transparent 0 22px,#a8743e 22px 30px),
   linear-gradient(90deg,#8a5a2b 0 9px,transparent 9px calc(100% - 9px),#8a5a2b calc(100% - 9px));
  border-left:3px solid var(--ink);border-right:3px solid var(--ink);z-index:0}
.lvl{position:relative;z-index:1;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;
  border:3px solid var(--ink);border-radius:18px;padding:10px 14px 10px 10px;box-shadow:0 6px 0 var(--ink);background:var(--c);transition:transform .1s}
.lvl:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.lvl .big{width:62px;height:62px}
.lvl .nm{font:400 25px/1 var(--f-comic);letter-spacing:.05em;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.lvl .sub{font:800 13.5px/1.25 var(--f-body);color:var(--ink);margin-top:3px}
.lvl .prog{font:400 17px/1.1 var(--f-tile);text-align:right;color:var(--ink);white-space:nowrap}
.lvl .prog small{display:block;font:800 12px var(--f-body)}
.lvl.here{outline:4px dashed #fff;outline-offset:4px}
.climber{position:absolute;right:-6px;top:-34px;width:46px;height:52px;z-index:2;pointer-events:none}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* ===== pályaválasztó ===== */
.topbar{display:flex;align-items:center;gap:8px}
.topbar .ttl{flex:1;min-width:0;text-align:center;font:400 26px/1 var(--f-comic);letter-spacing:.05em;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.topbar .ttl small{display:block;font:900 13px var(--f-body);-webkit-text-stroke:0;text-shadow:0 1px 0 var(--ink);letter-spacing:0}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 6px 0 var(--ink)}
.stage{display:grid;gap:4px;justify-items:center;background:none;border:0;padding:0}
.stage .tl{width:100%;aspect-ratio:1;max-width:76px}
.stage .st{font-size:14px;letter-spacing:1px;color:var(--yellow-d);-webkit-text-stroke:.6px var(--ink);min-height:18px}
.stage.next .tl .face{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-4px)}}

/* ===== csempék ===== */
.t{position:relative;display:grid;place-items:center;border:3px solid var(--ink);border-radius:18%;color:#fff;
  font:400 calc(var(--cs,56px)*.56)/1 var(--f-tile);-webkit-text-stroke:calc(var(--cs,56px)*.035) var(--ink);paint-order:stroke fill;
  text-shadow:0 calc(var(--cs,56px)*.05) 0 var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.28) 0 38%,transparent 38%),var(--bg);
  box-shadow:inset 0 calc(var(--cs,56px)*-.08) 0 var(--bd)}
.t.d3{font-size:calc(var(--cs,56px)*.4);letter-spacing:-.02em}
.t.n{--bg:var(--num);--bd:var(--num-d)}
.t.o{--bg:var(--plus);--bd:var(--plus-d)}
.t.o.m{--bg:var(--minus);--bd:var(--minus-d)}
.t.e{--bg:var(--eq);--bd:var(--eq-d)}
.t.b{--bg:var(--blank);--bd:var(--blank-d);background:var(--bg);box-shadow:inset 0 calc(var(--cs,56px)*.08) 0 var(--bd);cursor:pointer}
.t.b.sel{--bg:#ffe27a;--bd:#f0b400;animation:selp 1s ease-in-out infinite}
@keyframes selp{50%{transform:scale(1.07)}}
.t.f{--bg:#5bc0ff;--bd:#2f8fd6;cursor:pointer}
.t.ok{--bg:var(--ok);--bd:var(--ok-d)}
.t.okflash{animation:okf .6s}
@keyframes okf{40%{transform:scale(1.18) rotate(-4deg)}}
.t.bad{--bg:var(--bad);--bd:#c52b2b;animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.t.hintflash{animation:hintf 1s}
@keyframes hintf{0%{box-shadow:0 0 0 0 var(--yellow)}50%{box-shadow:0 0 0 8px var(--yellow)}}

/* ===== füzet ===== */
.pad{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:6px 6px 10px 10px;
  box-shadow:6px 6px 0 -2px var(--paper2),6px 6px 0 1px var(--ink),12px 12px 0 -2px var(--paper2),12px 12px 0 1px var(--ink);
  padding:34px 12px 18px;margin:10px 12px 12px 0;
  background-image:linear-gradient(90deg,transparent 0 30px,rgba(255,93,143,.25) 30px 32px,transparent 32px),
                   repeating-linear-gradient(180deg,transparent 0 27px,rgba(47,155,255,.13) 27px 28px)}
.rings{position:absolute;left:10px;right:10px;top:-16px;display:flex;justify-content:space-between;pointer-events:none}
.rings i{width:14px;height:34px;border:3.5px solid #3b6f8f;border-radius:8px;background:transparent;box-shadow:inset 2px 0 0 #9fd3ef}
.grid{display:grid;justify-content:center;gap:var(--gap,4px);margin:0 auto}
.grid .t{width:var(--cs);height:var(--cs)}
.grid .x{width:var(--cs);height:var(--cs)}

/* tálca */
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 6px 0 var(--ink);min-height:84px;--cs:54px}
.tray .t{width:var(--cs);height:var(--cs);cursor:grab;touch-action:none}
.tray .t.used{visibility:hidden}
.tray .t.pick{transform:translateY(-6px);box-shadow:inset 0 calc(var(--cs)*-.08) 0 var(--bd),0 0 0 4px var(--yellow)}
.ghost{position:fixed;z-index:50;pointer-events:none;width:58px;height:58px;--cs:58px;transform:translate(-50%,-60%) rotate(-6deg);filter:drop-shadow(0 8px 0 rgba(27,27,47,.35))}
.hud{display:flex;justify-content:center;gap:16px;color:#fff;font:900 14px var(--f-body);text-shadow:0 1px 0 var(--ink)}
.hud b{font:400 18px var(--f-tile)}

/* győzelem */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(27,27,47,.45);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{position:relative;width:min(420px,100%);background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:70px 20px 20px;display:grid;gap:12px;text-align:center;animation:pop .45s}
.burst{position:absolute;left:50%;top:-70px;width:220px;transform:translateX(-50%) rotate(-6deg)}
.burst svg{width:100%;height:auto;display:block}
.stars{font-size:46px;letter-spacing:6px;line-height:1}
.stars span{color:#d9dbe4;-webkit-text-stroke:2px var(--ink);display:inline-block}
.stars span.on{color:var(--yellow);animation:starin .5s backwards}
.stars span.on:nth-child(2){animation-delay:.18s}.stars span.on:nth-child(3){animation-delay:.36s}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}}
.card .msg{font:800 17px/1.35 var(--f-body)}
.card .meta{font:800 13px var(--f-body);color:#5d5e70}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
canvas#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.tray{--cs:46px;gap:7px}.lvl .nm{font-size:22px}}

/* szabálykönyv — széles képernyőn a bal oldali üres sávban, keskenyen gombra nyílik */
.rules{position:fixed;z-index:2;top:max(16px,env(safe-area-inset-top,0px));width:300px;left:max(16px,calc(50% - 280px - 28px - 300px));
  max-height:calc(100% - 32px);overflow:auto;background:#fff7c2;border:3px solid var(--ink);border-radius:6px 18px 18px 18px;box-shadow:6px 6px 0 var(--ink);
  padding:16px 16px 14px;transform:rotate(-1.2deg);display:grid;gap:12px;
  background-image:repeating-linear-gradient(180deg,transparent 0 25px,rgba(47,155,255,.18) 25px 26px)}
.rules::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:24px;transform:translateX(-50%) rotate(2deg);background:rgba(255,93,143,.55);border:2px solid rgba(27,27,47,.35)}
.rhead{font:400 28px/1 var(--f-comic);letter-spacing:.05em;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.rhead small{display:block;font:900 13px var(--f-body);-webkit-text-stroke:0;color:var(--ink);text-shadow:none;letter-spacing:0;margin-top:4px}
.rule{display:grid;gap:4px}
.rc{font:400 19px/1.1 var(--f-tile);color:var(--eq-d)}
.rt{font:700 14px/1.35 var(--f-body)}
.mini{display:flex;flex-wrap:wrap;gap:3px;--cs:30px;margin-top:2px}
.mini .t{width:var(--cs);height:var(--cs);border-width:2px}
.rnote{font:800 13px/1.35 var(--f-body);background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:8px 10px}
.rold summary{cursor:pointer;font:900 13.5px var(--f-body);text-decoration:underline}
.rold[open]{display:grid;gap:10px}
.rsub{font:400 17px var(--f-comic);letter-spacing:.05em;margin-top:6px}
.szabgomb{display:none}
@media (max-width:1199px){
  .rules{display:none}
  .szabgomb{display:inline-block}
  .rules.nyitva{display:grid;position:fixed;inset:auto;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1deg);width:min(360px,calc(100% - 32px));max-height:calc(100% - 60px);z-index:42}
  .rulesbg{position:fixed;inset:0;background:rgba(27,27,47,.45);z-index:41}
}
.rclose{justify-self:end;display:none}
.rules.nyitva .rclose{display:inline-block}

/* ===== v2: játékosok, gardrób, napi, Einstein, formák, gyors, lapozó ===== */
.panel{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;display:grid;gap:14px}
.panel .row,.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.plist{display:grid;gap:10px}
.pcard{display:flex;align-items:stretch;gap:8px}
.pvalaszt{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--ink);border-radius:16px;background:#eaf6ff;padding:8px 12px;box-shadow:0 4px 0 var(--ink)}
.pcard.akt .pvalaszt{background:#fff1b8}
.pav{width:52px;height:60px;flex:0 0 auto}.pav svg{width:100%;height:100%;overflow:visible}
.pnm{font:400 24px/1 var(--f-comic);letter-spacing:.04em}
.psub{font:800 13px var(--f-body);color:#4a4b5e}
.ptorol{border:3px solid var(--ink);border-radius:14px;background:#fff;font:400 18px var(--f-comic);padding:0 12px;box-shadow:0 4px 0 var(--ink)}
.ptorol.biztos{background:var(--bad);color:#fff;font-size:15px}
.pform{display:grid;gap:8px}
.pform label{font:900 14px var(--f-body)}
.pform input,.pform select{font:800 18px var(--f-body);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
.pform input:focus,.pform select:focus{outline:4px solid var(--yellow)}
.pform .row{margin-top:6px}
.profrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.daily{border:3px solid var(--ink);border-radius:18px;background:linear-gradient(135deg,#ff9a1f,#ff5d8f);box-shadow:0 6px 0 var(--ink);padding:12px 16px;text-align:center;color:#fff}
.daily:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.daily .dl{font:400 30px/1 var(--f-comic);letter-spacing:.06em;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.daily .ds{font:900 14px var(--f-body);text-shadow:0 1px 0 var(--ink);margin-top:4px}
.daily.kesz{background:linear-gradient(135deg,#34c759,#4fd1c5)}
.einstein{background:#2d4a3e;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px 14px;display:grid;gap:12px;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:14px 14px}
.einstein .eh{font:400 clamp(26px,7vw,34px)/1 var(--f-comic);letter-spacing:.05em;color:#fff;text-align:center;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg)}
.einstein .es{font:800 14px/1.35 var(--f-body);color:#e9f5ee;text-align:center}
.mountain.e::before{display:none}
.lvl .ajanl{position:absolute;left:-8px;top:-12px;background:var(--yellow);border:2.5px solid var(--ink);border-radius:8px;padding:2px 8px;font:400 14px var(--f-comic);letter-spacing:.06em;transform:rotate(-6deg);box-shadow:0 3px 0 var(--ink)}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.wcard{display:grid;justify-items:center;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px;box-shadow:0 5px 0 var(--ink)}
.wcard.akt{background:#fff1b8;outline:4px dashed #fff;outline-offset:3px}
.wcard.zar{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.wav{width:78px;height:92px}.wav svg{width:100%;height:100%;overflow:visible}
.wnm{font:400 17px/1.05 var(--f-comic);letter-spacing:.02em;text-align:center;overflow-wrap:anywhere;hyphens:auto}
.wk{font:800 12.5px var(--f-body);color:#4a4b5e}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;font:400 20px var(--f-tile);text-shadow:0 2px 0 var(--ink)}
.stages{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:10px!important;padding:14px!important}
@media (max-width:420px){.stages{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
/* forma-kocka */
.t.a{--bg:#e3f6ff;--bd:#a9d8ef;background:var(--bg);box-shadow:inset 0 calc(var(--cs,56px)*-.06) 0 var(--bd);padding:3px;cursor:help;overflow:visible}
.t.a svg{width:100%;height:100%;display:block}
.t.a .al{font:400 36px var(--f-tile);fill:#1b1b2f;stroke:#fff;stroke-width:7px;paint-order:stroke}
.t.a .al.sm{font-size:31px}.t.a .al.xs{font-size:25px}
.t.a .ab{position:absolute;right:-7px;top:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--eq);border:2.5px solid var(--ink);
  font:400 13px/15px var(--f-tile);color:#fff;-webkit-text-stroke:0;text-shadow:none;text-align:center;padding:0 3px}
.t.a.aok{--bg:#d9f7e1;--bd:var(--ok)}
.t.f2{opacity:.95;outline:3px dashed #fff;outline-offset:-6px}
/* szabálykönyv-kiegészítés */
.rk{font:400 20px var(--f-tile);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 10px;justify-self:start}
.rule.villan{animation:villan 1.6s ease-out;border-radius:10px}
@keyframes villan{0%,40%{background:#ffe27a;box-shadow:0 0 0 6px #ffe27a}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
